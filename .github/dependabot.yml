# Automated dependency updates for the pinned workflow actions. The
# gitleaks binary pin and the semgrep image digest are bumped manually,
# alongside their checksums.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait out the window where a freshly published release is most likely to
    # be malicious or broken before proposing it (supply-chain hygiene; also
    # gives upstream time to yank bad releases).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
