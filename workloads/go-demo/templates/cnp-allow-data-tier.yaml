# Workload-owned exception to the namespace's zero-trust floor (the
# network-policies chart deliberately ships only default-deny + DNS; per-app
# allows live with the workload they describe).
#
# toFQDNs names the SERVICE, not an address block: the rule stays correct
# across failovers and re-IPs, and every allowed flow is attributable by
# hostname in Hubble. It rides the DNS-proxy visibility the baseline
# allow-dns policy already gives every pod in the namespace.
#
# matchName over matchPattern, deliberately: Cilium's `*` wildcard matches
# DNS-name characters but never dots, so a pattern like
# `*.<region>.rds.amazonaws.com` silently fails to match the multi-label
# Aurora cluster endpoint (`<cluster>.cluster-<hash>.<region>...`) and the
# policy drops the very traffic it was written to allow. The exact endpoint
# hostnames are already bridged from Terraform as values for the pods' env,
# so the policy pins the same two names — strictly narrower than any
# wildcard, and the two rules can never drift apart.
#
# One policy covers all three pod shapes (server, worker, db-init Job) via
# the part-of label — the worker gaining unused 5432 reach is the accepted
# cost of one object instead of three.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-go-demo-data-tier
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: go-demo
  egress:
    - toFQDNs:
        - matchName: {{ .Values.auroraHost | quote }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: {{ .Values.redisHost | quote }}
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
