# Init-only secret material: the RDS-managed master credential (referenced by
# full ARN because RDS generates its name) and the app-user credential the Job
# provisions in the database. Mounted exclusively by the db-init Job pod under
# the db-init IRSA identity — the runtime role cannot read the master secret,
# and the runtime pods never mount this class.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: go-demo-db-init
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsRegion | quote }}
    objects: |
      - objectName: {{ .Values.auroraMasterSecretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: master-username
          - path: password
            objectAlias: master-password
      - objectName: {{ .Values.dbSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: app-username
          - path: password
            objectAlias: app-password
