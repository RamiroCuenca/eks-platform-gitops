# Two identities, split by privilege. The runtime SA (server + worker pods)
# can read only the app-user DB credential and the Redis connection secret;
# the db-init SA is the ONLY identity able to read the RDS master secret, and
# nothing long-running ever uses it. A compromised app pod cannot escalate to
# the master login.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.app }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.goDemoRoleArn | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.dbInit }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.dbInitRoleArn | quote }}
