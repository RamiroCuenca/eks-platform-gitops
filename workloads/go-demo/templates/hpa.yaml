{{- if .Values.hpa.enabled }}
# CPU-based scaling for the HTTP path (the worker's queue-length scaling is
# KEDA's job, added in the autoscaling phase). Utilization is computed against
# the container's CPU request; the Deployment sets no CPU limit so the load
# test measures scaling, not throttling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-demo-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-demo-server
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
