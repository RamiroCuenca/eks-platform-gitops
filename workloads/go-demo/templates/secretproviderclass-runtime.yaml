# Runtime secret material: the app-user DB password and the Redis AUTH token,
# extracted from their JSON secrets by jmesPath into individual tmpfs files.
# The app reads them file-first (DB_PASSWORD_FILE / REDIS_PASSWORD_FILE), so
# secret values never touch the process environment. Connection FACTS (hosts,
# ports, dbname) are deliberately not here — they are non-secret and arrive as
# plain env from the cluster-Secret annotation bridge.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: go-demo-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsRegion | quote }}
    objects: |
      - objectName: {{ .Values.dbSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: password
            objectAlias: db-password
      - objectName: {{ .Values.redisSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: auth_token
            objectAlias: redis-auth-token
