# Cluster-internal only: validation goes through port-forward and the Phase 11
# k6 load generator runs in-cluster. No Ingress/LoadBalancer — a public
# endpoint on a build-and-destroy demonstration platform is deliberate
# non-scope (same posture as the ArgoCD UI).
apiVersion: v1
kind: Service
metadata:
  name: go-demo
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: go-demo
spec:
  type: ClusterIP
  selector:
    app: go-demo-server
  ports:
    - name: http
      port: 80
      targetPort: http
