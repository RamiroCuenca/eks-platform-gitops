apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Binds this ServiceAccount to the Terraform-created IRSA role. When a pod
    # using this SA is scheduled, the EKS Pod Identity webhook injects a
    # projected token + AWS env vars; the ASCP provider exchanges that token
    # (sts:AssumeRoleWithWebIdentity) for the role's scoped credentials.
    eks.amazonaws.com/role-arn: {{ .Values.demoAppSecretsRoleArn | quote }}
