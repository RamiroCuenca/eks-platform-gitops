# Tells the AWS provider which secret to fetch and how to expose it. The pod
# references this by name in its CSI volumeAttributes. objectType
# "secretsmanager" pulls from AWS Secrets Manager; the value is mounted as a
# file at the pod's mountPath (no Kubernetes Secret object is created).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-app-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsRegion | quote }}
    objects: |
      - objectName: {{ .Values.demoSecretName | quote }}
        objectType: secretsmanager
