# amd64 fallback NodePool — present from day one as an architecture safety net.
# Pods that explicitly request amd64 via `nodeSelector: kubernetes.io/arch:
# amd64` land here; everything else routes to the higher-weight arm64 pool.
#
# Instance shape mirrors the arm64 pool but on Intel / AMD silicon (c7i, c7a,
# m7i, m7a, r7i, r7a, plus 8th-gen equivalents as they become available).
# Capacity and disruption settings are identical so a workload that flips
# architecture for compatibility reasons sees the same operational behaviour.
#
# Weight 10 deprioritises this pool — Karpenter only schedules here when a
# pod's requirements rule out the arm64 pool.

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose-amd64
spec:
  weight: 10
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: In
          values: ["7", "8"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values:
            - nano
            - micro
            - small
            - metal
            - 12xlarge
            - 16xlarge
            - 24xlarge
            - 32xlarge
            - 48xlarge
      expireAfter: 720h
  limits:
    cpu: {{ .Values.nodePoolLimits.cpu }}
    memory: {{ .Values.nodePoolLimits.memory }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
