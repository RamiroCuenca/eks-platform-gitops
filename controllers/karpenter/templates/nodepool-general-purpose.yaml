# Default NodePool — arm64 (Graviton), spot-first, single general-purpose pool.
# Pods without an arch nodeSelector land here. See nodepool-general-purpose-amd64
# for the amd64 fallback.
#
# Instance shape:
#   - Graviton 4 (c8g/m8g/r8g) and Graviton 3 (c7g/m7g/r7g) — c+m+r covers
#     CPU-bound, balanced, and memory-bound workloads under one pool.
#   - Sizes medium..8xlarge — excludes nano/micro/small (per-node overhead
#     waste) and 12xlarge+ (large reclamation blast radius on spot).
#
# Capacity:
#   - spot first with on-demand fallback. Karpenter watches the SQS
#     interruption queue (created by the infra repo) and gracefully drains
#     nodes inside the 2-minute warning window. Mass-reclamation is mitigated
#     by the broad instance allowlist diversifying across spot pools.
#
# Disruption:
#   - consolidationPolicy WhenEmptyOrUnderutilized + consolidateAfter 30s:
#     aggressive consolidation. Trades node churn for cost; appropriate for
#     this cluster. Longer-lived production teams might raise to 5-15m.
#   - expireAfter 720h (30d): forces full node rotation on a monthly
#     cadence, paired with `bottlerocket@latest` in the EC2NodeClass to roll
#     forward security patches without manual ops.
#
# Weight 100 makes this the preferred pool when a pod has no arch nodeSelector;
# the amd64 fallback has weight 10.

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose
spec:
  weight: 100
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Cilium is the CNI: a freshly launched node is NotReady until the Cilium
      # agent programs its datapath. This startup taint blocks pod scheduling
      # until the agent removes it, closing the race where a pod lands on a node
      # whose networking isn't up yet. See infra journal "Karpenter ↔ Cilium".
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: In
          values: ["7", "8"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values:
            - nano
            - micro
            - small
            - metal
            - 12xlarge
            - 16xlarge
            - 24xlarge
            - 32xlarge
            - 48xlarge
      expireAfter: 720h
  limits:
    cpu: {{ .Values.nodePoolLimits.cpu }}
    memory: {{ .Values.nodePoolLimits.memory }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
