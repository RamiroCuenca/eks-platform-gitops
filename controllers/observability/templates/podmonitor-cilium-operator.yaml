# Cilium operator metrics (:9963) — ENI/IPAM allocation health, the
# subsystem that needed hardening twice during bootstrap (region resolution,
# DescribeRouteTables). Same PodMonitor reasoning as the agent: named
# `prometheus` container port, no fronting Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
  labels:
    app.kubernetes.io/part-of: observability
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      io.cilium/app: operator
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
