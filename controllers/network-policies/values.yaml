# Application namespaces that receive the default-deny baseline. Per-app allow
# rules (app -> Aurora, app -> Redis, ingress -> app) are versioned alongside
# the workloads they describe; this chart only ships the zero-trust floor plus
# the DNS allow every workload needs to resolve names.
appNamespaces:
  - demo

# Create the Namespace objects listed above. The `demo` namespace exists purely
# to demonstrate default-deny during validation (two pods, traffic dropped
# until an explicit allow is added). Real application namespaces in later phases
# are created by their own workload charts — set this false there and let this
# chart contribute only the policies.
createNamespaces: true

# Open intra-namespace pod-to-pod traffic. Off by default: the baseline is
# strict zero-trust, so even same-namespace traffic is denied until an explicit
# allow is added. Flip on per-namespace for apps that want open east-west
# traffic within their own namespace.
allowIntraNamespace: false
