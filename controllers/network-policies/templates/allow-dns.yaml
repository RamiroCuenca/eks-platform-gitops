{{- range $ns := .Values.appNamespaces }}
---
# DNS is allowed for every pod — nothing functions without name resolution.
# Egress is scoped to kube-dns on port 53 and uses Cilium's DNS-aware proxy, so
# the allow is L7 (the queried names are visible in Hubble) rather than a blanket
# port open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
