# AWS Secrets and Configuration Provider (ASCP) = Secrets Store CSI driver +
# AWS provider. Sync wave 0 — installs the secrets-store.csi.x-k8s.io CRDs
# (SecretProviderClass) and the two node DaemonSets before any workload that
# mounts a secret (the demo at apps/secrets-demo.yaml, sync wave 2).
#
# Two upstream charts delivered as one multi-source Application:
#   1. secrets-store-csi-driver (kubernetes-sigs) — the driver + the CRD.
#      tokenRequests asks the driver to mint a projected ServiceAccount token
#      with the sts.amazonaws.com audience and hand it to the provider; without
#      it IRSA silently fails (the provider cannot obtain web-identity creds).
#   2. secrets-store-csi-driver-provider-aws — the AWS provider DaemonSet.
#      Its chart bundles the driver as a subchart with install:true BY DEFAULT,
#      so install:false here prevents a double-install of the driver above.
#
# Nothing account-specific is committed; neither chart needs cluster facts, so
# the cluster generator is used only to target the cluster (no values block).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secrets-store-csi
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{ .name }}-secrets-store-csi'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      sources:
        # 1. The driver + the SecretProviderClass CRD.
        - repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
          chart: secrets-store-csi-driver
          targetRevision: 1.6.0
          helm:
            releaseName: secrets-store-csi-driver
            valuesObject:
              # Load-bearing: mint a projected SA token (audience
              # sts.amazonaws.com) for the provider to exchange for the
              # workload's IRSA role. Omit this and IRSA silently fails.
              tokenRequests:
                - audience: sts.amazonaws.com
              # Mount-only posture: never mirror the value into an
              # etcd-stored Kubernetes Secret. (See the journal decision.)
              syncSecret:
                enabled: false
              enableSecretRotation: false
        # 2. The AWS provider DaemonSet.
        - repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
          chart: secrets-store-csi-driver-provider-aws
          targetRevision: 3.1.1
          helm:
            releaseName: secrets-store-csi-driver-provider-aws
            valuesObject:
              # The driver is installed by the source above — do not let this
              # chart's bundled subchart install a second copy.
              secrets-store-csi-driver:
                install: false
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
