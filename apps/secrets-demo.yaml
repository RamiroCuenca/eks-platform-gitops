# Demonstration workload for the IRSA + ASCP secret mount. Sync wave 2 — runs
# after the CSI driver/provider (wave 0) and after the demo namespace +
# default-deny policies (network-policies, wave 1) exist.
#
# The workload sits in the `demo` namespace under full default-deny egress
# (DNS only) yet still receives its secret: the AWS provider DaemonSet performs
# the IRSA-scoped GetSecretValue on the node and hands the pod a file, so the
# app itself makes no network call to AWS. See workloads/secrets-demo/README.md.
#
# Per-cluster facts (the demo-app IRSA role ARN, the secret name, the region)
# are read from the ArgoCD cluster Secret written by the infra repo's argocd
# module — nothing account-specific is committed here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secrets-demo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          demoAppSecretsRoleArn: '{{ index .metadata.annotations "platform.io/demo-app-secrets-role-arn" }}'
          demoSecretName: '{{ index .metadata.annotations "platform.io/demo-secret-name" }}'
          awsRegion: '{{ index .metadata.annotations "platform.io/aws-region" }}'
  template:
    metadata:
      name: '{{ .name }}-secrets-demo'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: demo
      source:
        repoURL: https://github.com/RamiroCuenca/eks-platform-gitops.git
        targetRevision: main
        path: workloads/secrets-demo
        helm:
          releaseName: secrets-demo
          valuesObject:
            demoAppSecretsRoleArn: '{{ .values.demoAppSecretsRoleArn }}'
            demoSecretName: '{{ .values.demoSecretName }}'
            awsRegion: '{{ .values.awsRegion }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Safety net only — the demo namespace is created and governed
          # (default-deny + allow-dns) by the network-policies chart at wave 1.
          - CreateNamespace=true
          - ServerSideApply=true
