# Cluster StorageClasses (controllers/storage). Sync wave 0 — storage
# primitives exist before anything that claims a volume, alongside the other
# wave-0 platform installs. Nothing account-specific: the cluster generator is
# used only to target the cluster, like the CSI driver install.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{ .name }}-storage'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        # StorageClasses are cluster-scoped; the namespace is only the
        # default for any namespaced resource this chart might add later.
        namespace: kube-system
      source:
        repoURL: https://github.com/RamiroCuenca/eks-platform-gitops.git
        targetRevision: main
        path: controllers/storage
        helm:
          releaseName: storage
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
