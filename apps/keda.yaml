# KEDA — event-driven autoscaling. Sync wave 0: installs the keda.sh CRDs
# (ScaledObject, TriggerAuthentication) that the go-demo chart's worker
# scaler (wave 2) creates resources against; same CRD-then-CR split as
# karpenter and kube-prometheus-stack.
#
# KEDA complements the HPA rather than replacing it: the server keeps its
# CPU-based HPA (load-proportional), while the worker scales on Redis queue
# DEPTH — the signal that actually describes a backlog. Under the hood KEDA
# drives an HPA via the external-metrics API, which is why the metrics
# server component exists.
#
# No IRSA / pod identity: the only scaler this platform uses authenticates
# to ElastiCache with the Redis AUTH token (not IAM), delivered through a
# TriggerAuthentication in the workload's chart.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{ .name }}-keda'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: keda
      sources:
        - repoURL: https://kedacore.github.io/charts
          chart: keda
          # Pinned at chart authoring; bump deliberately via PR on this repo.
          targetRevision: 2.20.1
          helm:
            releaseName: keda
            valuesObject:
              # Global scheduling values apply to all three components
              # (operator, metrics API server, admission webhooks): a
              # cluster-critical controller tier, pinned to the system MNG
              # like ArgoCD, Karpenter and the monitoring stack.
              tolerations:
                - key: node-tier
                  operator: Equal
                  value: system
                  effect: NoSchedule
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: karpenter.sh/nodepool
                            operator: DoesNotExist
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
