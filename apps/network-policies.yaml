# Baseline network policies, fanned out to every registered cluster.
#
# Unlike the Karpenter ApplicationSets this needs no per-cluster facts from the
# cluster Secret — the policies are identical across clusters — so the cluster
# generator is used only to target each cluster, with no values block.
#
# Sync wave 1: the Cilium CRDs these policies use are installed by the Cilium
# Helm release in the infra repo (Terraform), which is healthy before ArgoCD
# ever runs, so the CRDs always exist by sync time. The wave just keeps these
# behind the wave-0 controllers for a tidy ordering in the ArgoCD UI.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: network-policies
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{ .name }}-network-policies'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      source:
        repoURL: https://github.com/RamiroCuenca/eks-platform-gitops.git
        targetRevision: main
        path: controllers/network-policies
        helm:
          releaseName: network-policies
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
